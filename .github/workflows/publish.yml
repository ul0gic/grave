name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Guard — version must match release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(uv run python -c 'import tomllib; d=tomllib.load(open("pyproject.toml","rb")); print(d["project"]["version"])')"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' resolves to '${TAG}' but pyproject.toml version is '${PKG_VERSION}'. Aborting."
            exit 1
          fi
          echo "Version check passed: ${PKG_VERSION}"

      - name: Build
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Smoke-test wheel
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install Python
        run: uv python install 3.13

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install wheel into clean venv
        run: |
          uv venv smoke-venv
          uv pip install --python smoke-venv/bin/python dist/*.whl

      - name: Smoke tests
        run: |
          smoke-venv/bin/grave --version
          smoke-venv/bin/grave --help
          smoke-venv/bin/grave presets
          smoke-venv/bin/grave completion bash

  publish:
    name: Publish to PyPI
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/grave-cli

    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
