name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Guard — version must match release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(uv run python -c 'import tomllib; d=tomllib.load(open("pyproject.toml","rb")); print(d["project"]["version"])')"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' resolves to '${TAG}' but pyproject.toml version is '${PKG_VERSION}'. Aborting."
            exit 1
          fi
          echo "Version check passed: ${PKG_VERSION}"

      - name: Build
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    name: Smoke-test wheel
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Python
        run: uv python install 3.13

      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install wheel into clean venv
        run: |
          uv venv smoke-venv
          uv pip install --python smoke-venv/bin/python dist/*.whl

      - name: Smoke tests
        run: |
          smoke-venv/bin/grave --version
          smoke-venv/bin/grave --help
          smoke-venv/bin/grave presets
          smoke-venv/bin/grave completion bash

  publish:
    name: Publish to PyPI
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/grave-cli

    permissions:
      id-token: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
