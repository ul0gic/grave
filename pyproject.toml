[project]
name = "grave-cli"
version = "3.1.0"
description = "GRAVE — Git Repository Abandonment & Vintage Explorer. Dig up dead, forgotten, and vintage GitHub repositories."
readme = "pypi.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "ul0gic" },
]
keywords = ["github", "archaeology", "cli", "abandoned", "vintage", "repositories"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=14.3.2",
]

[project.urls]
Homepage = "https://github.com/ul0gic/grave"
Repository = "https://github.com/ul0gic/grave"
Issues = "https://github.com/ul0gic/grave/issues"

[project.scripts]
grave = "grave.cli.parser:main"

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.18.0",
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "TCH",  # flake8-type-checking
    "S",    # flake8-bandit (security)
    "PERF", # Perflint (performance anti-patterns)
    "FURB", # refurb (modernization)
    "FLY",  # flynt (f-string conversion)
    "PIE",  # flake8-pie (misc improvements)
    "ISC",  # flake8-implicit-str-concat
    "ERA",  # eradicate (no commented-out code)
    "Q",    # flake8-quotes (quote consistency)
    "ASYNC", # async correctness
    "DTZ",  # timezone-aware datetime usage
    "LOG",  # logging correctness
    "G",    # logging format
    "A",    # builtin shadowing
    "ARG",  # unused function arguments
    "BLE",  # blind exception catches
    "TRY",  # exception-handling hygiene
    "PL",   # pylint-derived correctness rules
]
ignore = [
    "S311",  # standard PRNG — random.choice() selects display presets, not crypto material
    "ISC001", # implicit str concat on one line — conflicts with ruff formatter
    "TRY003", # messages at raise sites are the CLI's user-facing error text
    "PLC0415", # lazy imports inside commands are intentional — they keep CLI startup fast
    "PLR2004", # literal thresholds/widths in a small CLI are self-evident; naming them adds noise
]

[tool.ruff.lint.isort]
known-first-party = ["grave"]

[tool.ruff.lint.per-file-ignores]
# S603/S607 are scoped here, not global — new subprocess sites elsewhere get flagged.
"grave/integrations/github.py" = ["S603", "S607"]  # the intentional gh subprocess wrapper
"grave/commands/init.py" = ["S603", "S607", "PLR0912", "PLR0915"]  # gh checks; linear interactive wizard
"grave/cli/parser.py" = ["PLR0915"]  # declarative argparse tree — long by nature, not complex
"grave/commands/specs.py" = ["DTZ011"]  # --abandoned/--dead-since cutoffs use the user's local date
# Tests relax rules that only make sense for production code: assert is pytest's
# model (S101), fake tokens aren't secrets (S106), no __init__ in a test root
# (INP001), mock signatures have unused params (ARG001), literal expectations are
# the point (PLR2004), local-date math mirrors specs.py (DTZ011), and subprocess
# smoke tests run trusted argv lists (S603/S607).
"tests/**" = ["S101", "S106", "INP001", "ARG001", "PLR2004", "DTZ011", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
files = ["grave"]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Not part of --strict; catches use-before-assignment so mypy agrees with Pyright.
enable_error_code = ["possibly-undefined"]
# PEP 420 namespace packages: the package ships no __init__.py, so mypy must
# treat directories under grave/ as namespace subpackages and resolve module
# names from the package root (grave/) rather than each file's parent. Without
# this it cannot disambiguate same-named modules (e.g. config/presets.py vs
# commands/presets.py). Config only — no code is suppressed.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=grave --cov-report=term-missing"
timeout = 60

[tool.coverage.run]
source = ["grave"]
branch = true

[tool.coverage.report]
# __main__ is a thin `python -m grave` shim exercised only at process start;
# the TYPE_CHECKING import guards are never executed at runtime.
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 88

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["grave"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
